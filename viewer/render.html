</head><body><div id="c"></div>
<!-- Headless page driven by tools/cloud/render.mjs via Playwright. -->
<script type="module">
import { createViewer } from "./lib/viewer.js";
import { parseModel } from "./lib/loaders.js";
const v = createViewer(document.getElementById("c"), { preserveDrawingBuffer: true, pixelRatio: 1 });
window.__viewer = v;
window.__load = async (url, name) => {
  const buf = await (await fetch(url)).arrayBuffer();
  v.show(await parseModel(name || url, buf));
  return v.stats();
};
window.__ready = true;
</script></body></html>
