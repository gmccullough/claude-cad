<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One-screen app: header with view tabs, full-bleed 3D stage, floating controls + readout. */
  :root {
    --bg: #eef0f2; --panel: #ffffffee; --line: #d3d8de; --fg: #1d232b; --muted: #5d6874;
    --accent: #e0662a; --accent-fg: #ffffff;
    --font-ui: "IBM Plex Sans", system-ui, sans-serif; --font-num: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #171a1f; --panel: #22272ee8; --line: #353c46; --fg: #e6e9ed; --muted: #97a1ad;
    --accent: #f08048; --accent-fg: #1a0d05; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #171a1f; --panel: #22272ee8; --line: #353c46; --fg: #e6e9ed; --muted: #97a1ad;
    --accent: #f08048; --accent-fg: #1a0d05; color-scheme: dark }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font-ui); overflow: hidden; }
  .app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; border-bottom: 1px solid var(--line);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px; padding: 4px 12px; font: inherit; cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .stage { position: relative; min-height: 0; }
  #canvas { position: absolute; inset: 0; }
  #canvas canvas { display: block; touch-action: none; }
  .controls { position: absolute; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
  .controls > * { pointer-events: auto; }
  .btn, select.btn { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .btn:focus-visible, .tab:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cut { display: flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
  .cut input[type=range] { width: 120px; accent-color: var(--accent); }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 12px; }
  .readout { position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); }
  .readout dl { display: grid; grid-template-columns: auto auto; gap: 2px 14px; margin: 0; }
  .readout dt { color: var(--muted); }
  .readout dd { margin: 0; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; color: var(--muted); }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 24px; text-align: center; pointer-events: none; }
  [hidden] { display: none !important; }
  @media (max-width: 560px) { .cut input[type=range] { width: 80px; } .hide-sm { display: none; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap">

<div class="app">
  <header>
    <h1>{{TITLE}}</h1>
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
  </header>
  <div class="stage">
    <div id="canvas"></div>
    <div class="controls">
      <button class="btn" id="fit" type="button">Fit</button>
      <select class="btn" id="view" aria-label="Camera">
        <option value="iso">Iso</option><option value="iso2">Iso left</option><option value="front">Front</option>
        <option value="back">Back</option><option value="left">Left</option><option value="right">Right</option>
        <option value="top">Top</option><option value="bottom">Bottom</option>
      </select>
      <button class="btn" id="spin" type="button" aria-pressed="false">Spin</button>
      <button class="btn" id="edges" type="button" aria-pressed="true">Edges</button>
      <button class="btn hide-sm" id="ortho" type="button" aria-pressed="false">Ortho</button>
      <span class="cut"><label><input type="checkbox" id="cut-on"> Cut Z</label>
        <input type="range" id="cut-z" min="0" max="1" step="0.1" value="1" aria-label="Cut height">
        <span class="num" id="cut-val">off</span></span>
    </div>
    <div class="readout" id="readout" hidden></div>
    <div class="status" id="status">Loading viewer…</div>
  </div>
</div>

<script type="application/json" id="data">{{DATA}}</script>
<script type="importmap">{ "imports": { "three": "{{THREE}}/build/three.module.js", "three/addons/": "{{THREE}}/examples/jsm/" } }</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";

/*{{CORE}}*/

const $ = id => document.getElementById(id);
const DATA = JSON.parse($("data").textContent);
const COLORS = ["#8fb3d9", "#8fd18a", "#c69be0", "#e0cf6f", "#6fe0cf"];

function b64bytes(b64) {
  const s = atob(b64), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}
async function gunzip(u8) {
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
}
// packed mesh: uint32 nverts, uint32 ntris, float32 xyz[], uint32 tri[]
function meshFromPacked(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const nv = dv.getUint32(0, true), nt = dv.getUint32(4, true);
  const pos = new Float32Array(u8.buffer.slice(u8.byteOffset + 8, u8.byteOffset + 8 + nv * 12));
  const idx = new Uint32Array(u8.buffer.slice(u8.byteOffset + 8 + nv * 12, u8.byteOffset + 8 + nv * 12 + nt * 12));
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g.toNonIndexed();
}
const cache = new Map();
async function loadFile(key) {
  if (!cache.has(key)) {
    const blob = DATA.blobs[key], bytes = b64bytes(blob.b64);
    cache.set(key, blob.kind === "3mf" ? await parseModel(blob.name, bytes.buffer)
      : { parts: [{ name: blob.name, object: blob.name, kind: "normal", geometry: meshFromPacked(await gunzip(bytes)) }], pauses: [], bed: null, settings: null });
  }
  const m = cache.get(key);
  return { ...m, parts: m.parts.map(p => ({ ...p, geometry: p.geometry.clone() })) };
}

const v = createViewer($("canvas"));
v.setScheme("paper");
v.set({ edges: true, bed: false });
v.loop();

const fmt = (n, d = 1) => Number(n).toFixed(d);
let current = null;
async function showView(id) {
  const view = DATA.views.find(x => x.id === id) || DATA.views[0];
  current = view;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", String(t.dataset.id === view.id)));
  $("status").hidden = false; $("status").textContent = `Loading ${view.label}…`;
  const models = await Promise.all(view.files.map(loadFile));
  const merged = { parts: models.flatMap(m => m.parts), pauses: models.flatMap(m => m.pauses),
                   bed: models.find(m => m.bed)?.bed ?? null, settings: models.find(m => m.settings)?.settings ?? null };
  v.show(merged);
  const s = v.stats();
  const objs = [...new Set(merged.parts.filter(p => p.kind === "normal").map(p => p.object))];
  $("readout").innerHTML = `<dl>
      <dt>Size X × Y × Z</dt><dd class="num">${s.size.map(n => fmt(n)).join(" × ")} mm</dd>
      <dt>Volume</dt><dd class="num">${fmt(s.volume_mm3 / 1000, 2)} cm³ · ~${fmt(s.volume_mm3 / 1000 * 1.24, 1)} g PLA solid</dd>
      <dt>Triangles</dt><dd class="num">${s.tris.toLocaleString()}</dd></dl>` +
    (objs.length > 1 ? `<div class="legend">${objs.map((o, i) => `<span><span class="sw" style="background:${COLORS[i % COLORS.length]}"></span>${o}</span>`).join("")}</div>` : "");
  $("readout").hidden = false;
  const z0 = s.min[2], z1 = s.max[2];
  Object.assign($("cut-z"), { min: z0, max: z1, step: Math.max((z1 - z0) / 400, 0.01) });
  $("cut-z").value = merged.pauses[0]?.z ?? (z0 + z1) / 2;
  applyCut();
  $("view").value = "iso";
  $("status").hidden = true;
}

function applyCut() {
  const on = $("cut-on").checked, z = +$("cut-z").value;
  $("cut-val").textContent = on ? `${fmt(z, 1)} mm` : "off";
  v.setSection(on ? "z" : null, z);
}
$("cut-on").addEventListener("change", applyCut);
$("cut-z").addEventListener("input", () => { $("cut-on").checked = true; applyCut(); });

for (const view of DATA.views) {
  const b = document.createElement("button");
  Object.assign(b, { className: "tab", type: "button", textContent: view.label });
  b.dataset.id = view.id;
  b.addEventListener("click", () => { location.hash = view.id; });
  $("tabs").appendChild(b);
}
const press = (id, key) => $(id).addEventListener("click", () => {
  const on = $(id).getAttribute("aria-pressed") !== "true";
  $(id).setAttribute("aria-pressed", String(on)); v.set({ [key]: on });
});
press("spin", "rotate"); press("edges", "edges");
$("ortho").addEventListener("click", () => {
  const on = $("ortho").getAttribute("aria-pressed") !== "true";
  $("ortho").setAttribute("aria-pressed", String(on)); v.setOrtho(on);
});
$("fit").addEventListener("click", () => v.setView($("view").value));
$("view").addEventListener("change", e => v.setView(e.target.value));
addEventListener("hashchange", () => showView(location.hash.slice(1)));
showView(location.hash.slice(1)).catch(e => { $("status").hidden = false; $("status").textContent = `Could not load the model: ${e.message}`; });
</script>
